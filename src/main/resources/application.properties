spring.application.name=gis

spring.datasource.url=jdbc:postgresql://localhost:5432/gis_db
spring.datasource.username=postgres
spring.datasource.password=1234@
spring.datasource.driver-class-name=org.postgresql.Driver

# Initialize Schema (Enable PostGIS)
spring.sql.init.mode=always

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable Hibernate Batch Inserts for Performance
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# File Upload Limits (Important for GIS files)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Connection Pool - Important for batch performance
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
